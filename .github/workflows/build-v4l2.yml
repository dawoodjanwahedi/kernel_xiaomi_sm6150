name: Build V4L2 Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y git make bc bison openssl curl zip kmod cpio flex libelf-dev libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 python-is-python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Clone clang
      run: git clone --depth=1 https://gitlab.com/itsshashanksp/android_prebuilts_clang_host_linux-x86_clang-r547379.git $HOME/clang

    - name: Build kernel
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=sleeping-bag
        export KBUILD_BUILD_USER=itsshashanksp
        mkdir -p out
        make clean && make mrproper
        make vendor/sdmsteppe-perf_defconfig O=out
        make vendor/sweet.config O=out
        make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 AR=llvm-ar NM=llvm-nm LD=ld.lld OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Package
      run: |
        git clone --depth=1 https://github.com/itsshashanksp/AnyKernel3.git --single-branch -b master zip
        cp out/arch/arm64/boot/Image.gz zip/
        cp out/arch/arm64/boot/dtbo.img zip/ 2>/dev/null || true
        cp out/arch/arm64/boot/dtb.img zip/ 2>/dev/null || true
        cd zip && zip -r9 SLEEPY-v4l2-SWEET.zip * -x .git README.md LICENSE *placeholder

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-zip
        path: zip/SLEEPY-v4l2-SWEET.zip
